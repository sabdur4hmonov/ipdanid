services:
  api:
    image: iprasm-api:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SERVER_GENERATION: "1"
      HOST: 0.0.0.0
      PORT: "4311"
      DATABASE_PATH: /data/iprasm.sqlite
      ERASURE_LEDGER_PATH: /privacy/erasure-intents.sqlite
      TRUSTED_PROXY_IPS: ${APP_PROXY_IP:-172.30.51.2}
      GALLERY_MAX_ITEMS: ${GALLERY_MAX_ITEMS:-10000}
      GALLERY_MAX_BYTES: ${GALLERY_MAX_BYTES:-268435456}
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH}
      CODE_PEPPER: ${CODE_PEPPER:?Set CODE_PEPPER}
      SANDBOX_PAYMENT_KEY: ${SANDBOX_PAYMENT_KEY:?Set SANDBOX_PAYMENT_KEY}
      PAYMENTS_SANDBOX: ${PAYMENTS_SANDBOX:-0}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_LOGIN: ${PAYME_LOGIN:-}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY:-}
      FCM_MODE: ${FCM_MODE:-disabled}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      FCM_WEB_API_KEY: ${FCM_WEB_API_KEY:-}
      FCM_WEB_APP_ID: ${FCM_WEB_APP_ID:-}
      FCM_SENDER_ID: ${FCM_SENDER_ID:-}
      FCM_VAPID_PUBLIC_KEY: ${FCM_VAPID_PUBLIC_KEY:-}
      TRANSACTIONAL_EMAIL_MODE: ${TRANSACTIONAL_EMAIL_MODE:-disabled}
      TRANSACTIONAL_EMAIL_FROM: ${TRANSACTIONAL_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - sqlite:/data
      - erasure:/privacy
    # Outbound HTTPS for explicitly configured push/mail providers; no host API port.
    networks:
      backend:
        ipv4_address: ${APP_API_IP:-172.30.51.3}
      egress: {}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4311/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  caddy:
    image: iprasm-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["caddy-data:/data", "caddy-config:/config"]
    networks:
      backend:
        ipv4_address: ${APP_PROXY_IP:-172.30.51.2}
      public: {}
    depends_on:
      api: {condition: service_healthy}
    logging: *logging
  backup:
    image: iprasm-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    command: ["node", "scripts/backup-sqlite.mjs", "--daemon"]
    environment:
      DATABASE_PATH: /data/iprasm.sqlite
      BACKUP_DIR: /backups
      ERASURE_LEDGER_PATH: /privacy/erasure-intents.sqlite
    volumes: ["sqlite:/data:ro", "erasure:/privacy:ro", "backups:/backups"]
    networks:
      backend:
        ipv4_address: ${APP_BACKUP_IP:-172.30.51.4}
    depends_on:
      api: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${APP_BACKEND_SUBNET:-172.30.51.0/24}
  public: {}
  egress: {}
volumes:
  sqlite: {}
  erasure: {}
  backups: {}
  caddy-data: {}
  caddy-config: {}
