name: Verify Ip Rasm
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-domain:
    runs-on: ubuntu-latest
    env:
      VITE_NATIVE_API_BASE: http://127.0.0.1:4483/api
      VITE_NATIVE_DEBUG_SETTINGS: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:locales
      - run: npm run build
      - run: node scripts/audit-customer-bundle.mjs dist
      - run: node -e "require('node:fs').mkdirSync('.ci-evidence',{recursive:true})"
      - run: npm test -- --testTimeout=30000 --reporter=json --outputFile=.ci-evidence/unit.json
      - run: npm run test:sandbox
      - run: npm run test:customer:http
      - run: npx playwright install --with-deps chromium
      # Private portrait experiments require local evidence and are not public CI inputs.
      - run: npm run test:e2e:ci
      - run: node scripts/package-web-handoff.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ip-rasm-web-sandbox
          path: web-handoff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            .ci-evidence/unit.json
            .ci-evidence/browser.json
  android:
    runs-on: ubuntu-latest
    env:
      # Public local-test address; debug Admin can select the owner HTTPS API.
      VITE_NATIVE_API_BASE: http://127.0.0.1:4483/api
      VITE_NATIVE_DEBUG_SETTINGS: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The obsolete SDK tools package is no longer published.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run mobile:sync
      - run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ip-rasm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
